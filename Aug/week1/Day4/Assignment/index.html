<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login Form</title>
</head>
<body>

  <h1>Login form using HTML and CSS</h1>

  <h3>Sign in</h3>
  <p>Sign in with your username and password</p>

  <form action="#" method="post">
    <label for="username">Your username</label>
    <input type="text" id="username" name="username" placeholder="Enter Username"><br><br>

    <label for="password">Your password</label>
    <input type="password" id="password" name="password" placeholder="Enter Password"><br><br>

    <button type="submit">Login</button>
  </form>
  

  <p>Not a member? <a href="#">Register here!</a></p>

 
 
</body>
<!-- Student Registration Form -->
<div style="background-color:aqua; padding:20px;">

  <div style="border:2px solid black; padding:4px; margin-bottom:40px;">
    <div style="border:1px solid black; text-align:center; padding:20px;">
      <h1 style="margin:0; font-size:42px;">Student Registration Form</h1>
    </div>
  </div>

  <form action="#" method="post">

    <p><label style="display:inline-block; width:180px; font-size:20px;">Name :</label>
    <input type="text" style="width:240px;" placeholder="Enter full name"></p>

    <p><label style="display:inline-block; width:180px; font-size:20px;">Father's Name :</label>
    <input type="text" style="width:240px;"></p>

    <p><label style="display:inline-block; width:180px; font-size:20px;">Mother's Name :</label>
    <input type="text" style="width:240px;"></p>

    <p><label style="display:inline-block; width:180px; font-size:20px;">Phone Number :</label>
    <input type="tel" style="width:240px;" placeholder="017xxxxxxxx"></p>

    <p><label style="display:inline-block; width:180px; font-size:20px;">Email :</label>
    <input type="email" style="width:240px;" placeholder="sample@example.com"></p>

    <p><label style="display:inline-block; width:180px; font-size:20px;">Gender :</label>
    <input type="radio" name="gender"> Male
    <input type="radio" name="gender"> Female
    <input type="radio" name="gender"> Other</p>

    <p><label style="display:inline-block; width:180px; font-size:20px;">Date Of Birth :</label>
    <input type="text" maxlength="2" style="width:40px;"> -
    <input type="text" maxlength="2" style="width:40px;"> -
    <input type="text" maxlength="4" style="width:60px;">
    <i>(dd-mm-yyyy)</i></p>

    <p><label style="display:inline-block; width:180px; font-size:20px;">Address :</label>
    <input type="text" style="width:380px;" placeholder="Street:- House:- Road:-"></p>

    <p><label style="display:inline-block; width:180px; font-size:20px;">Blood Group :</label>
    <select>
      <option>Select</option>
      <option>A+</option>
      <option>A-</option>
      <option>B+</option>
      <option>B-</option>
      <option>O+</option>
      <option>O-</option>
      <option>AB+</option>
      <option>AB-</option>
    </select></p>

    <p><label style="display:inline-block; width:180px; font-size:20px;">Department :</label>
    <input type="radio" name="department"> CSE
    <input type="radio" name="department"> EEE
    <input type="radio" name="department"> BBA</p>

    <p><label style="display:inline-block; width:180px; font-size:20px;">Course :</label>
    <input type="checkbox"> C
    <input type="checkbox"> C++
    <input type="checkbox"> Java
    <input type="checkbox"> AI
    <input type="checkbox"> Machine learning
    <input type="checkbox"> Robotics</p>

    <p><label style="display:inline-block; width:180px; font-size:20px;">Photo :</label>
    <input type="file"></p>

    <p style="margin-top:40px;">
      <a href="#" style="color:blue; margin-right:10px;">Submit</a>
      <button type="reset">Reset</button>
    </p>

  </form>

</div>
</html>
