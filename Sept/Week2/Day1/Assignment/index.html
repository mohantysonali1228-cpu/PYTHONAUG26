<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UsabilityHub</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
   
</head>

<body class="bg-white text-[#183b56]">

    <header class="w-full">
        <div
            class="max-w-[1450px] mx-auto px-5 sm:px-8 lg:px-10 py-6 flex items-center justify-between">

            <div class="flex items-center gap-2">

                <div
                    class="w-8 h-8 rounded-lg bg-red-800 flex items-center justify-center text-white text-sm">
                    ◆
                </div>

                <h2
                    class="text-[24px] sm:text-[28px] font-semibold text-[#273d4d]">
                    UsabilityHub
                </h2>

                <button
                    class="hidden sm:block ml-2 bg-[#edf5ff] text-[#183b56] px-4 py-2 rounded-md text-sm font-semibold">
                    Become a tester
                </button>

            </div>

            <nav class="hidden lg:flex items-center gap-8">

                <a href="#"
                    class="text-[17px] font-medium hover:text-[#2294e6]">
                    Product
                </a>

                <a href="#"
                    class="text-[17px] font-medium hover:text-[#2294e6]">
                    Customers
                </a>

                <a href="#"
                    class="text-[17px] font-medium hover:text-[#2294e6]">
                    Pricing
                </a>

                <a href="#"
                    class="flex items-center gap-2 text-[17px]  font-semibold hover:text-[#2294e6]">
                    Resources
                    <span>⌄</span>
                </a>

                <button
                    class="border border-gray-300 px-7 py-3 rounded-md font-semibold hover:bg-gray-50 cursor-pointer">
                    Sign in
                </button>

                <button
                    class="bg-[#2294e6] text-white px-7 py-3 rounded-md font-semibold shadow-md hover:bg-[#1786d5] cursor-pointer">
                    Sign up
                </button>

            </nav>

            <div class="flex lg:hidden gap-2">

                <button class="border border-gray-300 px-3 py-2 rounded-md text-sm font-semibold">
                    Sign in
                </button>

                <button class="bg-[#2294e6] text-white px-3 py-2 rounded-md text-sm font-semibold">
                    Sign up
                </button> 

             </div> 

        </div>
    </header>

    <section class="max-w-[1450px] mx-auto px-5 sm:px-8 lg:px-10">

        <div
            class="grid lg:grid-cols-2 items-center gap-10 lg:gap-5 py-16 lg:py-20">

            <div class="max-w-[620px]">

                <h1 class="text-[46px] sm:text-[55px] lg:text-[60px] font-bold leading-[1.1] tracking-tight text-[#183b56]">

                    Design confidently.
                </h1>
                
                <p class="mt-7 text-[19px] sm:text-[21px] leading-[1.6] text-[#57748a]">

                    UsabilityHub is a remote user research platform
                    that takes the guesswork out of design decisions
                    by validating them with real users.
                </p>
                
                <button class="mt-9 bg-[#2294e6] text-white px-10 py-4 rounded-md text-lg font-bold shadow-md hover:bg-[#1786d5] transition">

                    Get started
                </button>

            </div>
            
            <div class="flex justify-center lg:justify-end">

                <img
                    src="./images/hero-illustration.png"
                    alt="People "
                    class="w-full max-w-[760px] h-auto object-contain">

            </div>

        </div>

    </section>

    <section
        class="border-b border-gray-200 pb-12">

        <div
            class="max-w-[1450px] mx-auto px-5 sm:px-8 lg:px-10">


            <h2
                class="text-center lg:text-left text-[18px] sm:text-[20px] font-semibold text-[#183b56]">

                The world's best companies rely on UsabilityHub
                to make better design decisions.

            </h2>

            <div class="mt-10">

                <img
                    src="./images/WhatsApp Image 2026-09-08 at 12.10.22 AM.jpeg"
                    alt="Company logos"
                    class="w-full max-w-[1400px] mx-auto object-contain">

            </div>

        </div>

    </section>



</body>

</html>
