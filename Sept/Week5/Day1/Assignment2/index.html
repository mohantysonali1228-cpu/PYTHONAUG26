<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register & Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #444;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            opacity: 0.9;
        }

        .switch {
            text-align: center;
            margin-top: 20px;
            color: #555;
        }

        .switch span {
            color: #667eea;
            font-weight: bold;
            cursor: pointer;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }

        .hidden {
            display: none;
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 60px;
        }

        .show-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: auto;
            padding: 5px 8px;
            margin: 0;
            background: transparent;
            color: #667eea;
            font-size: 12px;
        }

        .welcome {
            text-align: center;
        }

        .welcome h2 {
            color: #667eea;
        }

        .logout {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div id="registerBox">

            <h2>Create Account</h2>

            <form id="registerForm">

                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="regName" placeholder="Enter your name">
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="regEmail" placeholder="Enter your email">
                </div>

                <div class="form-group">
                    <label>Password</label>

                    <div class="password-box">
                        <input type="password" id="regPassword" placeholder="Create password">

                        <button type="button"
                                class="show-btn"
                                onclick="showPassword('regPassword', this)">
                            Show
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>

                    <div class="password-box">
                        <input type="password" id="confirmPassword" placeholder="Confirm password">

                        <button type="button" class="show-btn" onclick="showPassword('confirmPassword', this)">
                            Show
                        </button>
                    </div>
                </div>

                <button type="submit">Register</button>

                <p id="registerMessage" class="message"></p>

            </form>

            <div class="switch">
                Already have an account?
                <span id="showLogin">Login</span>
            </div>

        </div>


       
        <div id="loginBox" class="hidden">

            <h2>Welcome Back</h2>

            <form id="loginForm">

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="Enter your email">
                </div>

                <div class="form-group">
                    <label>Password</label>

                    <div class="password-box">

                        <input type="password" id="loginPassword" placeholder="Enter your password">

                        <button type="button" class="show-btn" onclick="showPassword('loginPassword', this)">
                            Show
                        </button>

                    </div>
                </div>

                <button type="submit">Login</button>

                <p id="loginMessage" class="message"></p>

            </form>

            <div class="switch">
                Don't have an account?
                <span id="showRegister">Register</span>
            </div>

        </div>


        <div id="welcomeBox" class="hidden welcome">

            <h2>Login Successful </h2>

            <p id="welcomeText"></p>

            <button class="logout" id="logoutBtn">
                Logout
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
